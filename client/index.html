<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research Assistant</title>
    <!-- Tailwind CSS via CDN for rapid MVP development -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-gray-100 text-gray-900 font-sans h-screen flex overflow-hidden">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col">
        <div class="p-4 border-b border-gray-700 flex justify-between items-center">
            <h1 class="text-xl font-bold">NotebookLM</h1>
            <button id="new-notebook-btn" class="bg-blue-600 hover:bg-blue-700 text-white rounded p-1" title="New Notebook">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto">
            <ul id="notebook-list" class="flex flex-col">
                <!-- Notebooks rendered here -->
                <li class="p-4 text-gray-400 text-sm">Loading notebooks...</li>
            </ul>
        </div>
    </aside>

    <!-- Main Application Container -->
    <main class="flex-1 flex flex-col h-full bg-white relative">
        <!-- Empty State (When no notebook selected) -->
        <div id="empty-state" class="absolute inset-0 flex items-center justify-center -z-10 bg-gray-50">
            <div class="text-center">
                <p class="text-xl text-gray-500">Select or create a notebook to begin</p>
            </div>
        </div>

        <!-- Notebook Workspace -->
        <div id="main-content" class="hidden flex-1 flex flex-col h-full bg-white z-10">
            <header class="p-6 border-b">
                <h2 id="current-notebook-title" class="text-3xl font-bold text-gray-800">Notebook Title</h2>
            </header>
            
            <div class="flex-1 p-6 overflow-y-auto flex">
                <!-- Left Pane: Chat -->
                <div class="flex-1 flex flex-col border-r pr-6">
                    <div id="chat-messages" class="flex-1 border-2 border-gray-200 rounded-lg flex flex-col p-4 overflow-y-auto mb-4 bg-gray-50 space-y-4">
                        <div class="text-center text-gray-400 mt-10">
                            Ask a question about your uploaded sources!
                        </div>
                    </div>
                    <div class="mt-auto flex space-x-2">
                        <input type="text" id="chat-input" class="flex-1 border rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 bg-white" placeholder="Ask a question..." disabled>
                        <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition disabled:opacity-50" disabled>Send</button>
                    </div>
                </div>

                <!-- Right Pane: Sources -->
                <div class="flex-1 flex flex-col pl-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-semibold">Sources</h3>
                        <div>
                            <input type="file" id="file-upload" class="hidden" accept=".txt,.pdf">
                            <button id="add-url-btn" class="bg-gray-100 text-gray-700 px-3 py-1 rounded hover:bg-gray-200 transition text-sm font-medium mr-2">+ Add URL</button>
                            <button id="add-source-btn" class="bg-blue-100 text-blue-700 px-3 py-1 rounded hover:bg-blue-200 transition text-sm font-medium">+ Add File</button>
                        </div>
                    </div>
                    <div class="flex-1 border-2 border-dashed border-gray-200 rounded-lg flex flex-col overflow-y-auto bg-gray-50 p-4">
                        <ul id="source-list" class="space-y-2">
                            <!-- Sources rendered here -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Citation Modal -->
    <div id="citation-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-3/4 max-w-2xl max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center p-4 border-b">
                <h3 id="modal-title" class="text-lg font-bold truncate">Source Title</h3>
                <button id="modal-close" class="text-gray-500 hover:text-gray-800 font-bold text-xl leading-none">&times;</button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 text-gray-700 whitespace-pre-wrap leading-relaxed" id="modal-content">
                Source text...
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="/js/app.js" type="module"></script>
</body>
</html>
